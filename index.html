<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FieldOps — Service Operations Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================
   FIELDOPS — MAIN STYLESHEET
   Dark Industrial Ops Theme
============================================ */

:root {
  --bg-base: #0a0c0f;
  --bg-surface: #111318;
  --bg-card: #161a21;
  --bg-elevated: #1d2129;
  --bg-hover: #232830;
  --border: #252b35;
  --border-light: #2e3540;
  --text-primary: #e8eaf0;
  --text-secondary: #8892a0;
  --text-muted: #535d6b;
  --accent: #3b82f6;
  --accent-light: #60a5fa;
  --accent-dim: rgba(59, 130, 246, 0.12);
  --accent-glow: rgba(59, 130, 246, 0.25);
  --green: #22c55e;
  --green-dim: rgba(34, 197, 94, 0.12);
  --yellow: #eab308;
  --yellow-dim: rgba(234, 179, 8, 0.12);
  --red: #ef4444;
  --red-dim: rgba(239, 68, 68, 0.12);
  --blue: #3b82f6;
  --blue-dim: rgba(59, 130, 246, 0.12);
  --orange: #f97316;
  --orange-dim: rgba(249, 115, 22, 0.12);
  --sidebar-w: 240px;
  --sidebar-collapsed: 64px;
  --navbar-h: 60px;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-glow: 0 0 24px rgba(59, 130, 246, 0.15);
  --font-sans: 'DM Sans', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --transition: all 0.2s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.hidden { display: none !important; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.text-muted { color: var(--text-secondary); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.mono { font-family: var(--font-mono); }
.w-full { width: 100%; }

/* ===== LOGIN ===== */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.login-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 30% 50%, rgba(59,130,246,0.06) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 20%, rgba(34,197,94,0.04) 0%, transparent 50%);
}
.login-grid {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(var(--border) 1px, transparent 1px),
                    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.4;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.login-card {
  position: relative;
  width: 100%;
  max-width: 400px;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 40px;
  box-shadow: var(--shadow), 0 0 60px rgba(59,130,246,0.05);
}
.login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.logo-icon { font-size: 28px; }
.logo-text, .logo-name {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}
.login-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 32px; }
.login-form { display: flex; flex-direction: column; gap: 16px; }
.login-error {
  background: var(--red-dim);
  border: 1px solid rgba(239,68,68,0.3);
  color: var(--red);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
}
.demo-roles { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
.demo-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }
.demo-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.demo-btn {
  padding: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-light);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-sans);
  transition: var(--transition);
}
.demo-btn:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--accent-light); }

/* ===== APP LAYOUT ===== */
.app { display: flex; min-height: 100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  transition: width 0.25s ease;
  overflow: hidden;
}
.sidebar.collapsed { width: var(--sidebar-collapsed); }
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 16px;
  border-bottom: 1px solid var(--border);
  min-height: var(--navbar-h);
}
.sidebar-logo { display: flex; align-items: center; gap: 10px; overflow: hidden; white-space: nowrap; }
.sidebar-logo .logo-icon { font-size: 20px; flex-shrink: 0; }
.sidebar-logo .logo-name { font-family: var(--font-mono); font-size: 16px; font-weight: 700; transition: opacity 0.2s; }
.sidebar.collapsed .logo-name { opacity: 0; width: 0; }
.sidebar.collapsed .nav-label { opacity: 0; width: 0; }
.sidebar.collapsed .user-info { opacity: 0; width: 0; }
.sidebar-toggle { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 4px; flex-shrink: 0; }
.sidebar-toggle span { display: block; width: 16px; height: 1.5px; background: var(--text-muted); transition: var(--transition); }
.sidebar-nav { flex: 1; padding: 16px 8px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  text-decoration: none;
  color: var(--text-secondary);
  transition: var(--transition);
  white-space: nowrap;
  overflow: hidden;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active { background: var(--accent-dim); color: var(--accent-light); border: 1px solid rgba(59,130,246,0.2); }
.nav-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-label { font-size: 13px; font-weight: 500; transition: opacity 0.2s; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
.sidebar-user { display: flex; align-items: center; gap: 10px; overflow: hidden; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent-dim); border: 1px solid rgba(59,130,246,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--accent-light); flex-shrink: 0;
}
.user-info { display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.2s; }
.user-name { font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== NAVBAR ===== */
.main-wrap {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  transition: margin-left 0.25s ease;
  min-height: 100vh;
}
.main-wrap.collapsed { margin-left: var(--sidebar-collapsed); }
.navbar {
  height: var(--navbar-h);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky; top: 0; z-index: 50;
}
.navbar-left { display: flex; align-items: center; gap: 16px; }
.menu-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 20px; padding: 4px; display: none; }
.page-title { font-size: 17px; font-weight: 600; color: var(--text-primary); }
.navbar-right { display: flex; align-items: center; gap: 12px; }
.navbar-user { font-size: 13px; color: var(--text-secondary); }

/* ===== ROLE BADGE ===== */
.role-badge {
  display: inline-flex; align-items: center;
  padding: 3px 8px; border-radius: 20px;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  font-family: var(--font-mono);
}
.role-badge[data-role="sales"], .role-badge.sales { background: rgba(249,115,22,0.15); color: var(--orange); border: 1px solid rgba(249,115,22,0.3); }
.role-badge[data-role="scheduler"], .role-badge.scheduler { background: var(--blue-dim); color: var(--accent-light); border: 1px solid rgba(59,130,246,0.3); }
.role-badge[data-role="technician"], .role-badge.technician { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }

/* ===== MAIN CONTENT ===== */
.main-content { flex: 1; padding: 24px; overflow-y: auto; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 18px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; font-family: var(--font-sans);
  cursor: pointer; transition: var(--transition);
  border: 1px solid transparent; text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-light); box-shadow: 0 0 16px var(--accent-glow); }
.btn-secondary { background: var(--bg-elevated); color: var(--text-secondary); border-color: var(--border-light); }
.btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-success { background: var(--green-dim); color: var(--green); border-color: rgba(34,197,94,0.3); }
.btn-success:hover { background: rgba(34,197,94,0.2); box-shadow: 0 0 16px rgba(34,197,94,0.15); }
.btn-danger { background: var(--red-dim); color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn-ghost { background: transparent; color: var(--text-secondary); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-warning { background: var(--yellow-dim); color: var(--yellow); border-color: rgba(234,179,8,0.3); }
.btn-warning:hover { background: rgba(234,179,8,0.2); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 13px 28px; font-size: 15px; font-weight: 600; }
.btn-full { width: 100%; }
.btn-icon { padding: 8px; width: 34px; height: 34px; }

/* ===== FORM ELEMENTS ===== */
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
input, select, textarea {
  background: var(--bg-elevated);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13px;
  padding: 10px 13px;
  transition: var(--transition);
  width: 100%;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
input::placeholder, textarea::placeholder { color: var(--text-muted); }
select option { background: var(--bg-elevated); color: var(--text-primary); }
textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ===== CARDS ===== */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; transition: var(--transition); }
.card:hover { border-color: var(--border-light); box-shadow: var(--shadow-sm); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.card-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ===== STATUS BADGES ===== */
.status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
}
.status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.status-available { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.25); }
.status-booked { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(234,179,8,0.25); }
.status-completed { background: var(--blue-dim); color: var(--accent-light); border: 1px solid rgba(59,130,246,0.25); }
.status-blocked { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
.status-assigned { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(249,115,22,0.25); }

/* ===== TABLE ===== */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--bg-elevated); }
th { padding: 11px 16px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: var(--transition); cursor: pointer; }
tbody tr:hover { background: var(--bg-hover); }

/* ===== STAT CARDS ===== */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; position: relative; overflow: hidden; transition: var(--transition); }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.stat-card.blue::before { background: var(--accent); }
.stat-card.green::before { background: var(--green); }
.stat-card.yellow::before { background: var(--yellow); }
.stat-card.red::before { background: var(--red); }
.stat-card:hover { border-color: var(--border-light); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; }
.stat-value { font-size: 32px; font-weight: 700; font-family: var(--font-mono); color: var(--text-primary); line-height: 1; margin-bottom: 6px; }
.stat-meta { font-size: 12px; color: var(--text-secondary); }

/* ===== PAGE SECTIONS ===== */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-header h2 { font-size: 18px; font-weight: 600; }
.page-header p { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal {
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--radius-lg); padding: 28px;
  max-width: 520px; width: 100%;
  box-shadow: var(--shadow); animation: slideUp 0.2s ease;
  max-height: 90vh; overflow-y: auto;
}
.modal-lg { max-width: 680px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  background: var(--bg-elevated); border: 1px solid var(--border);
  color: var(--text-secondary); width: 30px; height: 30px;
  border-radius: var(--radius-sm); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: var(--transition);
}
.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.modal-form { display: flex; flex-direction: column; gap: 14px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }

/* ===== SALES PAGE ===== */
.sales-layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
.job-form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; position: sticky; top: 84px; }
.job-form-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.job-form-fields { display: flex; flex-direction: column; gap: 12px; }
.job-form-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== SCHEDULER PAGE ===== */
.slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
.slot-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: var(--transition); cursor: pointer; position: relative; }
.slot-card:hover { border-color: var(--border-light); box-shadow: var(--shadow-sm); transform: translateY(-2px); }
.slot-time { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.slot-service { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
.slot-tech { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
.slot-actions { display: flex; gap: 6px; margin-top: 12px; }
.service-group-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; margin-top: 20px; }
.service-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.service-group-name { font-size: 14px; font-weight: 700; color: var(--text-primary); }

/* ===== DETAIL PANEL ===== */
.scheduler-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
.detail-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; position: sticky; top: 84px; height: fit-content; }
.detail-panel.empty { display: flex; align-items: center; justify-content: center; min-height: 300px; color: var(--text-muted); font-size: 13px; }
.detail-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 4px; }
.detail-value { font-size: 14px; color: var(--text-primary); }

/* ===== TECHNICIAN PAGE ===== */
.tech-header { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.tech-jobs-list { display: flex; flex-direction: column; gap: 12px; }
.tech-job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; transition: var(--transition); }
.tech-job-card:hover { border-color: var(--border-light); box-shadow: var(--shadow-sm); }
.tech-job-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.tech-customer-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.tech-job-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.tech-meta-item { display: flex; flex-direction: column; gap: 2px; }
.tech-meta-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
.tech-meta-value { font-size: 13px; color: var(--text-secondary); }
.tech-job-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tech-work-form { background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }

/* ===== USERS PAGE ===== */
.users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.user-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; align-items: center; gap: 16px; transition: var(--transition); }

// ---- WRITE FUNCTIONS (Supabase) ----
async function addJob(job) {
  const newJob = { ...job, created_at: new Date().toISOString(), status: 'booked' };
  const { data, error } = await supabase.from('jobs').insert(newJob).select().single();
  if (error) { showToast('Failed to save job: ' + error.message, 'error'); return null; }
  window.mockState.jobs.unshift(data);
  const slot = window.mockState.slots.find(s => s.id === job.slot_id);
  if (slot) { slot.status = 'booked'; await supabase.from('slots').update({ status: 'booked' }).eq('id', job.slot_id); }
  return data;
}

async function assignTech(slotId, techId) {
  await supabase.from('slots').update({ technician_id: techId, status: 'booked' }).eq('id', slotId);
  const slot = window.mockState.slots.find(s => s.id === slotId);
  if (slot) { slot.technician_id = techId; slot.status = 'booked'; }
  const jobs = window.mockState.jobs.filter(j => j.slot_id === slotId && j.status === 'booked');
  for (const j of jobs) {
    await supabase.from('jobs').update({ status: 'assigned' }).eq('id', j.id);
    j.status = 'assigned';
  }
}

async function completeJob(jobId, updateData) {
  await supabase.from('jobs').update({ status: 'completed' }).eq('id', jobId);
  const job = window.mockState.jobs.find(j => j.id === jobId);
  if (job) job.status = 'completed';
  await supabase.from('job_updates').insert({ job_id: jobId, tech_id: window.currentUser?.id, ...updateData, updated_at: new Date().toISOString() }).catch(() => {});
}

  if (slot) slot.status = 'blocked';
}

async function unblockSlotDB(slotId) {
  await supabase.from('slots').update({ status: 'available' }).eq('id', slotId);
  const slot = window.mockState.slots.find(s => s.id === slotId);
  if (slot) slot.status = 'available';

async function createSlotDB(slotData) {

    if (role === 'technician') item.style.display = (page === 'dashboard' || page === 'jobs') ? 'flex' : 'none';
    else if (role === 'sales') item.style.display = (page === 'users') ? 'none' : 'flex';
    else item.style.display = 'flex';
  });
}

async function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const titles = { dashboard: 'Dashboard', jobs: 'Jobs', slots: 'Slots', users: 'Users' };
  document.getElementById('page-title').textContent = titles[page] || page;
  const role = window.currentUser?.role || 'sales';
  const content = document.getElementById('main-content');
  content.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div> Loading...</div>';
  document.getElementById('sidebar').classList.remove('mobile-open');
  await loadAppData();
  try {
    if (page === 'dashboard') {
      if (role === 'sales') content.innerHTML = renderSalesDashboard();
      else if (role === 'scheduler') content.innerHTML = renderSchedulerDashboard();
      else content.innerHTML = renderTechnicianDashboard();
    } else if (page === 'jobs') {
      if (role === 'technician') content.innerHTML = renderTechnicianDashboard();
      else content.innerHTML = renderJobsPage();
    } else if (page === 'slots') {
      content.innerHTML = renderSlotsPage();
    } else if (page === 'users') {
      content.innerHTML = renderUsersPage();
    }
  } catch (e) {
    content.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><p class="empty-state-text">Page error</p><p class="empty-state-sub">${e.message}</p></div>`;
  }
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const mainWrap = document.querySelector('.main-wrap');
  if (window.innerWidth <= 768) {
    sidebar.classList.toggle('mobile-open');
  } else {
    sidebarCollapsed = !sidebarCollapsed;
    sidebar.classList.toggle('collapsed', sidebarCollapsed);
    mainWrap.classList.toggle('collapsed', sidebarCollapsed);
  }
}

function showToast(message, type = 'info') {
  let container = document.querySelector('.toast-container');
  if (!container) { container = document.createElement('div'); container.className = 'toast-container'; document.body.appendChild(container); }
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

function loadAvailableSlots() {
  const serviceId = document.getElementById('f-service')?.value;
  const slotEl = document.getElementById('f-slot');
  if (!slotEl) return;
  if (!serviceId) { slotEl.innerHTML = '<option value="">Select service first</option>'; return; }
  const availSlots = window.mockState.slots.filter(s => s.service_id === serviceId && s.status === 'available');
  slotEl.innerHTML = availSlots.length
    ? '<option value="">Choose a time slot</option>' + availSlots.map(s => `<option value="${s.id}">${formatTime(s.time)} — ${s.date}</option>`).join('')
    : '<option value="">No slots available</option>';
}

async function bookJob() {
  const name = document.getElementById('f-name')?.value?.trim();
  const phone = document.getElementById('f-phone')?.value?.trim();
  const place = document.getElementById('f-place')?.value?.trim();
  const serviceId = document.getElementById('f-service')?.value;
  const slotId = document.getElementById('f-slot')?.value;
  if (!name || !phone || !place || !serviceId || !slotId) { showToast('Please fill all required fields (*)', 'error'); return; }
  const btn = document.querySelector('[onclick="bookJob()"]');
  if (btn) btn.textContent = 'Saving...';
  const result = await addJob({ customer_name: name, phone, alt_phone: document.getElementById('f-altphone')?.value||'', place, address: document.getElementById('f-address')?.value||'', location_link: document.getElementById('f-location')?.value||'', service_id: serviceId, slot_id: slotId, work_spec: document.getElementById('f-workspec')?.value||'', work_details: document.getElementById('f-workdetails')?.value||'', amount: parseFloat(document.getElementById('f-amount')?.value)||0, advance: parseFloat(document.getElementById('f-advance')?.value)||0, created_by: window.currentUser?.id });
  if (result) { showToast(`Job booked for ${name}!`, 'success'); resetForm(); navigate('dashboard'); }
  else if (btn) btn.textContent = '✓ Book Job';
}

function resetForm() {
  ['f-name','f-phone','f-altphone','f-place','f-address','f-location','f-workspec','f-workdetails','f-amount','f-advance'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const svcEl = document.getElementById('f-service'); const slotEl = document.getElementById('f-slot');
  if (svcEl) svcEl.value = '';
  if (slotEl) slotEl.innerHTML = '<option value="">Select service first</option>';
}
function scrollToForm() { document.getElementById('job-form')?.scrollIntoView({ behavior: 'smooth' }); }
function filterJobs(el, status) {
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
  const filtered = status === 'all' ? window.mockState.jobs : window.mockState.jobs.filter(j => j.status === status);
  const wrap = document.getElementById('jobs-table-wrap'); if (wrap) wrap.innerHTML = renderJobsTable(filtered);

function searchJobs(query) {
  const q = query.toLowerCase();
  const filtered = window.mockState.jobs.filter(j => j.customer_name.toLowerCase().includes(q) || j.phone.includes(q) || j.place.toLowerCase().includes(q));
  const wrap = document.getElementById('jobs-table-wrap'); if (wrap) wrap.innerHTML = renderJobsTable(filtered);
}

  const modal = document.createElement('div');
  modal.className = 'modal-overlay'; modal.id = 'assign-modal';
  modal.innerHTML = `<div class="modal"><div class="modal-header"><div class="modal-title">Assign Technician</div><button class="modal-close" onclick="closeModal('assign-modal')">✕</button></div><div style="margin-bottom:16px"><div class="text-sm text-muted">${svc.icon} ${svc.name} · ${formatTime(slot.time)}</div>${currentTech ? `<div class="text-sm" style="margin-top:4px">Current: ${currentTech.name}</div>` : ''}</div><div class="modal-form"><div class="form-group"><label>Select Technician</label><select id="assign-tech-select"><option value="">Choose technician...</option>${techs.map(t=>`<option value="${t.id}" ${currentTech?.id===t.id?'selected':''}>${t.name} — ${t.phone}</option>`).join('')}</select></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('assign-modal')">Cancel</button><button class="btn btn-primary" onclick="confirmAssign('${slotId}')">Assign</button></div></div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal('assign-modal'); });
}

async function confirmAssign(slotId) {
  const techId = document.getElementById('assign-tech-select')?.value;
  if (!techId) { showToast('Select a technician', 'error'); return; }
  await assignTech(slotId, techId); closeModal('assign-modal'); showToast('Technician assigned!', 'success'); navigate('dashboard');
}

async function blockSlot(slotId) { await blockSlotDB(slotId); showToast('Slot blocked', 'info'); navigate('dashboard'); }
async function unblockSlot(slotId) { await unblockSlotDB(slotId); showToast('Slot unblocked', 'success'); navigate('dashboard'); }

function openCreateSlotModal() {
  const services = window.mockState.services;
  const times = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
  const modal = document.createElement('div');
  modal.className = 'modal-overlay'; modal.id = 'create-slot-modal';
  modal.innerHTML = `<div class="modal"><div class="modal-header"><div class="modal-title">Create New Slot</div><button class="modal-close" onclick="closeModal('create-slot-modal')">✕</button></div><div class="modal-form"><div class="form-group"><label>Service *</label><select id="cs-service"><option value="">Select service</option>${services.map(s=>`<option value="${s.id}">${s.icon} ${s.name}</option>`).join('')}</select></div><div class="form-row"><div class="form-group"><label>Date *</label><input type="date" id="cs-date" value="${today()}" /></div><div class="form-group"><label>Time *</label><select id="cs-time">${times.map(t=>`<option value="${t}">${formatTime(t)}</option>`).join('')}</select></div></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('create-slot-modal')">Cancel</button><button class="btn btn-primary" onclick="createSlot()">Create Slot</button></div></div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal('create-slot-modal'); });
}

async function createSlot() {
  const serviceId = document.getElementById('cs-service')?.value, date = document.getElementById('cs-date')?.value, time = document.getElementById('cs-time')?.value;
  if (!serviceId || !date || !time) { showToast('Fill all fields', 'error'); return; }
  if (window.mockState.slots.find(s => s.service_id===serviceId && s.date===date && s.time===time)) { showToast('Slot already exists!', 'error'); return; }
  const result = await createSlotDB({ service_id: serviceId, date, time, status: 'available', technician_id: null });
  if (result) { closeModal('create-slot-modal'); showToast('Slot created!', 'success'); navigate('dashboard'); }
}

function renderSlotsPage() { return renderSchedulerDashboard(); }

// ============================================================
// TECHNICIAN DASHBOARD
// ============================================================
window.techWorkState = window.techWorkState || {};

function renderTechnicianDashboard() {
  const user = window.currentUser, allJobs = window.mockState.jobs;
  let myJobs = user?.id?.startsWith('demo-')
    ? allJobs.filter(j => j.status==='assigned' || j.status==='booked')
    : allJobs.filter(j => { const slot = getSlot(j.slot_id); return slot?.technician_id === user?.id; });
  const completedJobs = allJobs.filter(j => j.status === 'completed');
  const pendingJobs = myJobs.filter(j => j.status !== 'completed');
  return `
  <div class="tech-header">
    <div><div style="font-size:18px;font-weight:700">Good morning 👋</div><div class="text-muted" style="font-size:13px;margin-top:4px">${pendingJobs.length} job${pendingJobs.length!==1?'s':''} assigned today</div></div>
    <div style="text-align:right"><div class="stat-value" style="font-size:28px">${pendingJobs.length}</div><div class="text-xs text-muted">Pending</div></div>
  </div>
  <div class="stats-grid" style="margin-bottom:20px">
    <div class="stat-card green"><div class="stat-label">Assigned</div><div class="stat-value">${myJobs.filter(j=>j.status==='assigned').length}</div><div class="stat-meta">Ready to go</div></div>
    <div class="stat-card yellow"><div class="stat-label">Booked</div><div class="stat-value">${myJobs.filter(j=>j.status==='booked').length}</div><div class="stat-meta">Awaiting</div></div>
    <div class="stat-card blue"><div class="stat-label">Completed</div><div class="stat-value">${completedJobs.length}</div><div class="stat-meta">All time</div></div>
    <div class="stat-card blue"><div class="stat-label">Earnings</div><div class="stat-value" style="font-size:20px">₹${completedJobs.reduce((a,j)=>a+j.amount,0).toLocaleString()}</div><div class="stat-meta">Total collected</div></div>
  </div>
  <div class="section-title">Today's Jobs</div>
  <div class="tech-jobs-list" id="tech-jobs-list">
    ${pendingJobs.length ? pendingJobs.map(job => renderTechJobCard(job)).join('') : `<div class="empty-state"><div class="empty-state-icon">✅</div><p class="empty-state-text">All done for today!</p><p class="empty-state-sub">No pending jobs assigned</p></div>`}
  </div>
  ${completedJobs.length ? `<div class="section-title" style="margin-top:24px">Completed Jobs</div><div class="tech-jobs-list">${completedJobs.slice(0,3).map(job => renderTechJobCard(job, true)).join('')}</div>` : ''}`;
}

function renderTechJobCard(job, completed = false) {
  const svc = getService(job.service_id), slot = getSlot(job.slot_id), workState = window.techWorkState[job.id] || {};
  return `<div class="tech-job-card" id="tech-card-${job.id}">
    <div class="tech-job-header"><div><div class="tech-customer-name">${job.customer_name}</div><div style="font-size:12px;color:var(--text-muted);margin-top:2px">${svc.icon} ${svc.name}</div></div><span class="status status-${job.status}">${job.status}</span></div>
    <div class="tech-job-meta">
      <div class="tech-meta-item"><span class="tech-meta-label">Phone</span><span class="tech-meta-value">${job.phone}</span></div>
      <div class="tech-meta-item"><span class="tech-meta-label">Time</span><span class="tech-meta-value mono">${slot ? formatTime(slot.time) : '—'}</span></div>
      <div class="tech-meta-item"><span class="tech-meta-label">Place</span><span class="tech-meta-value">${job.place}</span></div>
      <div class="tech-meta-item"><span class="tech-meta-label">Amount</span><span class="tech-meta-value mono" style="color:var(--green)">₹${job.amount.toLocaleString()}</span></div>
    </div>
    <div style="font-size:13px;color:var(--text-secondary);background:var(--bg-elevated);border-radius:var(--radius-sm);padding:10px;margin-bottom:12px">${job.work_details}</div>
    ${!completed ? `
      <div class="tech-job-actions">
        <a href="tel:${job.phone}" class="btn btn-secondary btn-sm">📞 Call</a>
        ${job.location_link ? `<a href="${job.location_link}" target="_blank" class="btn btn-secondary btn-sm">🗺 Map</a>` : ''}
        ${job.status !== 'completed' ? (!workState.started ? `<button class="btn btn-success" onclick="startWork('${job.id}')" style="flex:1">▶ Start Work</button>` : `<button class="btn btn-danger" onclick="endWork('${job.id}')" style="flex:1">■ End Work</button>`) : ''}
      </div>
      ${workState.started && !workState.ended ? `<div style="margin-top:8px;padding:8px 12px;background:var(--green-dim);border:1px solid rgba(34,197,94,0.3);border-radius:var(--radius-sm);font-size:12px;color:var(--green)">● Work started at ${workState.startTime}</div>` : ''}
      ${workState.ended ? renderWorkSubmitForm(job) : ''}
    ` : `<div style="padding:8px 12px;background:var(--blue-dim);border:1px solid rgba(59,130,246,0.25);border-radius:var(--radius-sm);font-size:12px;color:var(--accent-light)">✓ Completed · Balance collected: ₹${(job.amount-job.advance).toLocaleString()}</div>`}
  </div>`;
}

function renderWorkSubmitForm(job) {
  const state = window.techWorkState[job.id] || {};
  return `<div class="tech-work-form" id="work-form-${job.id}">
    <div style="font-size:13px;font-weight:700;margin-bottom:4px">📝 Submit Work Report</div>
    <div style="display:flex;gap:8px;font-size:12px;color:var(--text-muted);margin-bottom:8px"><span>Start: <strong>${state.startTime||'—'}</strong></span><span>•</span><span>End: <strong>${state.endTime||'—'}</strong></span></div>
    <div class="form-group"><label>Work Done *</label><textarea id="wd-${job.id}" placeholder="Describe what was done..." rows="3"></textarea></div>
    <div class="form-group"><label>Issues Found</label><textarea id="wi-${job.id}" placeholder="Any issues or follow-up needed..." rows="2"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Final Amount (₹)</label><input type="number" id="wa-${job.id}" value="${job.amount}" /></div>
      <div class="form-group"><label>Payment Mode</label><select id="wp-${job.id}"><option value="cash">💵 Cash</option><option value="upi">📱 UPI</option><option value="card">💳 Card</option><option value="pending">⏳ Pending</option></select></div>
    </div>
    <button class="btn btn-primary btn-full btn-lg" onclick="submitWork('${job.id}')">✓ Submit Work Report</button>
  </div>`;
}

function startWork(jobId) {
  const now = new Date();
  window.techWorkState[jobId] = { started: true, ended: false, startTime: now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}), startTimeVal: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` };
  showToast('Work started! Clock is running.', 'success'); refreshTechCard(jobId);
}

function endWork(jobId) {
  const now = new Date();
  if (window.techWorkState[jobId]) { Object.assign(window.techWorkState[jobId], { ended: true, endTime: now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}), endTimeVal: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` }); }
  showToast('Work ended. Fill the report below.', 'info'); refreshTechCard(jobId);
}

function refreshTechCard(jobId) {
  const job = window.mockState.jobs.find(j => j.id === jobId);
  if (!job) return;
  const cardEl = document.getElementById(`tech-card-${jobId}`);
  if (cardEl) { const div = document.createElement('div'); div.innerHTML = renderTechJobCard(job); cardEl.replaceWith(div.firstElementChild); }
}

async function submitWork(jobId) {
  const workDone = document.getElementById(`wd-${jobId}`)?.value?.trim();
  if (!workDone) { showToast('Please describe the work done', 'error'); return; }
  const state = window.techWorkState[jobId] || {};
  await completeJob(jobId, { site_in: state.startTimeVal, site_out: state.endTimeVal, final_amount: parseFloat(document.getElementById(`wa-${jobId}`)?.value)||0, payment_mode: document.getElementById(`wp-${jobId}`)?.value, work_done: workDone, issues: document.getElementById(`wi-${jobId}`)?.value?.trim()||'None' });
  delete window.techWorkState[jobId];
  showToast('Work report submitted! Job marked complete.', 'success');
  setTimeout(() => navigate('dashboard'), 500);
}

// ============================================================
// USERS PAGE
// ============================================================
function renderUsersPage() {
  const users = window.mockState.users, role = window.currentUser?.role;
  if (role !== 'scheduler' && role !== 'admin') return `<div class="empty-state"><div class="empty-state-icon">🔒</div><p class="empty-state-text">Access restricted</p><p class="empty-state-sub">Only schedulers can view users</p></div>`;
  const salesUsers = users.filter(u=>u.role==='sales'), schedulerUsers = users.filter(u=>u.role==='scheduler'), techUsers = users.filter(u=>u.role==='technician');
  const stats = [{ label:'Total Users',value:users.length,color:'blue',meta:'Active'},{label:'Sales',value:salesUsers.length,color:'yellow',meta:'Team'},{label:'Schedulers',value:schedulerUsers.length,color:'blue',meta:'Ops'},{label:'Technicians',value:techUsers.length,color:'green',meta:'Field'}];
  return `${renderStatsGrid(stats)}
  <div class="page-header"><div><h2>Team Members</h2><p>All users in the system</p></div><button class="btn btn-primary" onclick="openAddUserModal()">+ Add User</button></div>
  <div class="section-title">Sales Team</div><div class="users-grid" style="margin-bottom:24px">${salesUsers.map(u=>renderUserCard(u)).join('')}</div>
  <div class="section-title">Schedulers</div><div class="users-grid" style="margin-bottom:24px">${schedulerUsers.map(u=>renderUserCard(u)).join('')}</div>
  <div class="section-title">Field Technicians</div><div class="users-grid">${techUsers.map(u=>renderUserCard(u)).join('')}</div>`;
}

function renderUserCard(user) {
  const avatarColors = { sales:'background:var(--orange-dim);color:var(--orange);border:1px solid rgba(249,115,22,0.3)', scheduler:'background:var(--blue-dim);color:var(--accent-light);border:1px solid rgba(59,130,246,0.3)', technician:'background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,0.3)' };
  const roleIcons = { sales:'💼', scheduler:'📅', technician:'🔧' };
  const jobCount = window.mockState.jobs.filter(j => { const slot = getSlot(j.slot_id); return slot?.technician_id === user.id; }).length;
  return `<div class="user-card"><div class="user-card-avatar" style="${avatarColors[user.role]||''}">${user.name[0].toUpperCase()}</div><div class="user-card-info"><div class="user-card-name">${user.name}</div><div class="user-card-phone">${user.phone}</div><div style="margin-top:6px;display:flex;gap:6px;align-items:center"><span class="role-badge ${user.role}">${roleIcons[user.role]} ${user.role}</span>${user.role==='technician'?`<span class="text-xs text-muted">${jobCount} jobs</span>`:''}</div></div></div>`;
}

function openAddUserModal() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay'; modal.id = 'add-user-modal';
  modal.innerHTML = `<div class="modal"><div class="modal-header"><div class="modal-title">Add New User</div><button class="modal-close" onclick="closeModal('add-user-modal')">✕</button></div><div class="modal-form"><div class="form-group"><label>Full Name *</label><input type="text" id="nu-name" placeholder="Full name" /></div><div class="form-group"><label>Email *</label><input type="email" id="nu-email" placeholder="user@company.com" /></div><div class="form-group"><label>Phone</label><input type="tel" id="nu-phone" placeholder="9876543210" /></div><div class="form-group"><label>Role *</label><select id="nu-role"><option value="sales">💼 Sales</option><option value="scheduler">📅 Scheduler</option><option value="technician">🔧 Technician</option></select></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('add-user-modal')">Cancel</button><button class="btn btn-primary" onclick="addUser()">Add User</button></div></div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal('add-user-modal'); });
}

async function addUser() {
  const name = document.getElementById('nu-name')?.value?.trim(), email = document.getElementById('nu-email')?.value?.trim(), phone = document.getElementById('nu-phone')?.value?.trim(), role = document.getElementById('nu-role')?.value;
  if (!name || !email) { showToast('Name and email required', 'error'); return; }
  const result = await addUserDB({ name, email, phone: phone||'—', role });
  if (result) { closeModal('add-user-modal'); showToast(`${name} added as ${role}!`, 'success'); navigate('users'); }
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => { checkSession().catch(() => {}); });
</script>
